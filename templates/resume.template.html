<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{NAME}} · 简历</title>
    <meta name="description" content="{{NAME}} · {{TITLE}} · {{SCHOOL}} · 个人简历">
    <meta property="og:type" content="profile">
    <meta property="og:title" content="{{NAME}} · 简历">
    <meta property="og:description" content="{{TITLE}} · {{SCHOOL}}">
    {{FAVICON_LINKS}}
    {{THEME_INIT_SCRIPT}}
    <style>:root { {{DEFAULT_THEME_VARS}} }</style>
    <link rel="stylesheet" href="/resume.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="/config.js" defer></script>
    <script src="/theme-utils.js" defer></script>
    <script src="/resume-page.js" defer></script>
</head>
<body class="resume-body">
    <a class="cv-skip" href="#resume-content">跳到简历内容</a>
    <header class="cv-topbar">
        <div class="cv-topbar-inner">
            <a class="cv-back" href="/"><span aria-hidden="true">←</span> 返回主页</a>
            <span class="cv-topbar-title">{{NAME}} <span>/ 简历</span></span>
            <div class="cv-topbar-actions">
                <button class="cv-print" id="resume-print" type="button" hidden><i class="fa-solid fa-arrow-down" aria-hidden="true"></i><span>打印 / PDF</span></button>
                <button class="nav-theme-toggle" id="nav-theme-toggle" type="button" aria-label="主题设置" title="主题设置"><i class="fa-solid fa-palette" aria-hidden="true"></i></button>
            </div>
        </div>
    </header>
    <main class="cv-page" id="resume-content" tabindex="-1">
        <section class="cv-hero" aria-labelledby="resume-name">
            <div class="cv-intro">
                <p class="cv-eyebrow"><span aria-hidden="true"></span>个人简历 <span class="cv-eyebrow-divider" aria-hidden="true">/</span> <span lang="en">RESUME</span></p>
                <h1 id="resume-name">{{NAME}}</h1>
                <p class="cv-position">{{TITLE}}</p>
                <p class="cv-school">{{SCHOOL}}</p>
                <div class="cv-keywords" aria-label="专业方向">{{SKILL_KEYWORDS}}</div>
            </div>
            {{RESUME_PORTRAIT}}
            <div class="cv-contacts" aria-label="联系方式">{{CONTACTS_HTML}}</div>
        </section>
        {{RESUME_STATS}}
        <div class="cv-layout">
            <aside class="cv-sidebar">
                <nav class="cv-section-nav" aria-label="简历章节">
                    <p class="cv-nav-label">简历目录 <span lang="en">CONTENTS</span></p>
                    {{RESUME_NAV}}
                </nav>
                {{PERSONAL_TAG}}
                <a class="cv-side-home" href="/">更多关于我 <span aria-hidden="true">↗</span></a>
            </aside>
            <div class="cv-content">{{RESUME_SECTIONS}}</div>
        </div>
        <footer class="cv-footer"><span>{{NAME}} · 个人简历</span><a href="#resume-content">回到顶部 <span aria-hidden="true">↑</span></a></footer>
    </main>
    <div class="theme-dropdown" id="theme-dropdown" aria-hidden="true">
        <div class="theme-section">
            <div class="theme-section-label">主题模式</div>
            <div class="theme-mode-list" id="theme-mode-list" role="listbox" aria-label="主题模式">
                <button class="theme-mode-item" type="button" data-mode="light" role="option" aria-selected="false"><i class="fa-solid fa-sun" aria-hidden="true"></i><span>浅色</span></button>
                <button class="theme-mode-item" type="button" data-mode="dark" role="option" aria-selected="false"><i class="fa-solid fa-moon" aria-hidden="true"></i><span>暗色</span></button>
            </div>
        </div>
        <div class="theme-divider"></div>
        <div class="theme-section">
            <div class="theme-section-label">配色方案</div>
            <div class="theme-scheme-list" id="theme-scheme-list" role="listbox" aria-label="配色方案"></div>
        </div>
    </div>
    <div class="cv-toast" id="resume-toast" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
